region:
  - 134
  - 6
  - 596
  - 1117
input_backend: win32
win32_fallback_to_pyautogui: false
loop_interval: 0.3
after_click_delay: 0.85
ocr_scale: 1.0
ocr_min_score: 0.45
ocr_max_side: 512
ocr_threads: 3
ocr_use_cls: false
ocr_skip_static: true
ocr_recheck_seconds: 3.0
stall_warn_seconds: 10
stall_pause_seconds: 90
auto_foreground: true
keep_foreground_seconds: 1
foreground_keywords:
- 一课英语
- OneClass
- 微信
ocr_engine: local
ocr_api:
  base_url: ''
  api_key: ''
  model: ''
  timeout: 20
debug: true
mark_too_easy: true
dictation_mode: whisper
fallback_on_audio_failure: reveal
auto_next_group: true
max_extra_groups: 0
unknown_choice_strategy: pause
pause_timeout_seconds: 12
dictation_submit_key: space
choice_match_threshold: 42
whisper_model: models/small.en
whisper_device: cpu
whisper_compute_type: int8
audio_sample_rate: 16000
audio_record_seconds: 2.0
audio_loopback_name: 扬声器 (Realtek(R) Audio)
speech_match_threshold: 60
whisper_beam_size: 1
audio_templates: true
audio_templates_strict: true    # 模板不是本机录的 -> 自动停用
audio_template_seconds: 1.2
audio_match_max_distance: 6.0
audio_match_min_margin: 0.4
fallback_points:
  reveal_answer:
  - 0.5
  - 0.53
  too_easy:

  - 0.835

  - 0.184

  know:
  - 0.5
  - 0.805
  next_word:
  - 0.5
  - 0.955
  continue_words:
  - 0.5
  - 0.955
  complete_confirm:
  - 0.5
  - 0.61
  start_memorize:
  - 0.5
  - 0.95
  timeout_next_group:
  - 0.664583
  - 0.559086
  start_next_group:
  - 0.5
  - 0.95
  speaker:
  - 0.49375
  - 0.27408
  dictation_input:
  - 0.48958
  - 0.37934
  dictation_confirm:
  - 0.49167
  - 0.45084
  unknown:
  - 0.5
  - 0.975
  test_question_finish:
  - 0.5
  - 0.975
  test_result_finish:
  - 0.74
  - 0.958
dictation_failure_strategy: reveal
dictation_fallback_word: zzzz
dictation_max_attempts: 1
dictation_retry_delay: 0.65
extra_group_retry_seconds: 3.0
purchase:
  enabled: false
  require_license: true
  provider: xiaoxin
  contact: '微信或QQ: 请填写你的联系方式'
  post_payment_note: 当前只使用易支付。付款完成后，客户端会自动按当前机器标识写入授权。
  xiaoxin:
    base_url: https://sylu.zhouwu.ccwu.cc
  pending_order: {}
  tiers:
    one_time:
      title: 一次性购买
      price_cents: 300
      description: 当前版本可用，使用易支付，不含后续长期更新
      product_path: /api/oneclass/pay/buy?tier=one_time
    lifetime_updates:
      title: 长期更新
      price_cents: 800
      description: 含后续更新支持，使用易支付
      product_path: /api/oneclass/pay/buy?tier=lifetime_updates
    upgrade_updates:
      title: 补差升级长期更新
